name: HelpDesk autotests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install

      # запускаем Unit и Integration тесты
      - name: Unit and integration tests
        run: npm test
        continue-on-error: true

      # устанавливаем start-server-and-test
      - name: Install start-server-and-test
        run: npm install --save-dev start-server-and-test

      # запускаем E2E-тесты
      - name: Run E2E Tests
        run: npm run test:e2e:ci
        env:
          CYPRESS_baseUrl: http://127.0.0.1:3000